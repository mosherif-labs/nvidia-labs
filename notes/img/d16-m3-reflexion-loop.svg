<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1041 405" width="1041" height="405" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1041" height="405" fill="#ffffff"/><rect x="20" y="60" width="230" height="100" rx="12" stroke="#1971c2" stroke-width="2" fill="#e7f5ff"/><polyline points="255.0,110.0 325.0,110.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="313.9,114.7 325.0,110.0 313.9,105.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="330" y="60" width="230" height="100" rx="12" stroke="#e8590c" stroke-width="2" fill="#fff4e6"/><polyline points="565.0,110.0 635.0,110.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="623.9,114.7 635.0,110.0 623.9,105.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="640" y="60" width="250" height="100" rx="12" stroke="#9c36b5" stroke-width="2" fill="#f8f0fc"/><polyline points="765.0,165.0 765.0,225.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="760.3,213.9 765.0,225.0 769.7,213.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="640" y="230" width="250" height="90" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><polyline points="635.0,275.0 135.0,275.0 135.0,165.0" stroke="#2f9e44" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="139.7,176.1 135.0,165.0 130.3,176.1" fill="none" stroke="#2f9e44" stroke-width="2"/><text x="20.0" y="30.0" font-size="20" fill="#1e1e1e" text-anchor="start">Reflexion in reflexion.py: learning without touching weights</text><text x="135.0" y="96.9" font-size="15" fill="#1971c2" text-anchor="middle">ACTOR · solve()</text><text x="135.0" y="115.6" font-size="15" fill="#1971c2" text-anchor="middle">agent.run(lessons + facts</text><text x="135.0" y="134.4" font-size="15" fill="#1971c2" text-anchor="middle">+ task), MAX_STEPS=2</text><text x="445.0" y="96.9" font-size="15" fill="#e8590c" text-anchor="middle">EVALUATOR · score()</text><text x="445.0" y="115.6" font-size="15" fill="#e8590c" text-anchor="middle">Day 8 deterministic:</text><text x="445.0" y="134.4" font-size="15" fill="#e8590c" text-anchor="middle">must_include + tools</text><text x="575.0" y="99.0" font-size="14" fill="#495057" text-anchor="start">FAIL</text><text x="765.0" y="96.9" font-size="15" fill="#9c36b5" text-anchor="middle">SELF-REFLECTION · reflect()</text><text x="765.0" y="115.6" font-size="15" fill="#9c36b5" text-anchor="middle">sees question + wrong answer</text><text x="765.0" y="134.4" font-size="15" fill="#9c36b5" text-anchor="middle">+ tools used, NEVER the key</text><text x="775.0" y="199.0" font-size="14" fill="#495057" text-anchor="start">remember(&quot;lessons&quot;) (run 1 only)</text><text x="765.0" y="271.2" font-size="15" fill="#2f9e44" text-anchor="middle">MEMORY · Supabase pgvector</text><text x="765.0" y="290.0" font-size="15" fill="#2f9e44" text-anchor="middle">namespace (investigator, lessons)</text><text x="250.0" y="299.0" font-size="14" fill="#2f9e44" text-anchor="start">run 2: recall(&quot;lessons&quot;, question) → into the Actor&#x27;s prompt</text><text x="20.0" y="354.0" font-size="14" fill="#495057" text-anchor="start">Run 1 = act, fail, write lessons. Run 2 = same budget, lessons recalled. The delta = what the notes taught.</text><text x="20.0" y="371.5" font-size="14" fill="#495057" text-anchor="start">Leak check: if a lesson contains the answer, run 2 measures memorization, not learning.</text></svg>