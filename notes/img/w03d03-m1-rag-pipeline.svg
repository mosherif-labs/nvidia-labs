="none"/><polyline points="155.4,289.1 145.0,295.0 156.5,298.4" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="20.0" y="32.0" font-size="22" fill="#1e1e1e" text-anchor="start">Day 13 RAG baseline: 7 stages, today&#x27;s tool at each</text><text x="20.0" y="61.0" font-size="16" fill="#1e1e1e" text-anchor="start">offline (ingest time)</text><text x="20.0" y="281.0" font-size="16" fill="#1e1e1e" text-anchor="start">online (per question)</text><text x="30.0" y="103.0" font-size="20" fill="#1e1e1e" text-anchor="start">1 ingest</text><text x="30.0" y="125.0" font-size="14" fill="#1e1e1e" text-anchor="start">load(): pypdf pages +</text><text x="30.0" y="142.5" font-size="14" fill="#1e1e1e" text-anchor="start">.md files, status: header</text><text x="320.0" y="103.0" font-size="20" fill="#1e1e1e" text-anchor="start">2 chunk</text><text x="320.0" y="125.0" font-size="14" fill="#1e1e1e" text-anchor="start">RecursiveCharacterTextSplitter</text><text x="320.0" y="142.5" font-size="14" fill="#1e1e1e" text-anchor="start">2000 chars, 300 overlap</text><text x="610.0" y="103.0" font-size="20" fill="#1e1e1e" text-anchor="start">3 embed</text><text x="610.0" y="125.0" font-size="14" fill="#1e1e1e" text-anchor="start">NeMo Retriever NIM</text><text x="610.0" y="142.5" font-size="14" fill="#1e1e1e" text-anchor="start">nemotron-3-embed-1b</text><text x="610.0" y="160.0" font-size="14" fill="#1e1e1e" text-anchor="start">input_type=passage</text><text x="900.0" y="103.0" font-size="20" fill="#1e1e1e" text-anchor="start">4 index</text><text x="900.0" y="125.0" font-size="14" fill="#1e1e1e" text-anchor="start">Milvus Lite rag.db</text><text x="900.0" y="142.5" font-size="14" fill="#1e1e1e" text-anchor="start">FLAT index, COSINE</text><text x="30.0" y="323.0" font-size="20" fill="#1e1e1e" text-anchor="start">5 retrieve</text><text x="30.0" y="345.0" font-size="14" fill="#1e1e1e" text-anchor="start">embed query (input_type=query)</text><text x="30.0" y="362.5" font-size="14" fill="#1e1e1e" text-anchor="start">top-5 + filter</text><text x="30.0" y="380.0" font-size="14" fill="#1e1e1e" text-anchor="start">status == &quot;current&quot;</text><text x="320.0" y="323.0" font-size="20" fill="#1e1e1e" text-anchor="start">6 rerank</text><text x="320.0" y="345.0" font-size="14" fill="#1e1e1e" text-anchor="start">reranking NIM</text><text x="320.0" y="362.5" font-size="14" fill="#1e1e1e" text-anchor="start">(not in today&#x27;s baseline)</text><text x="610.0" y="323.0" font-size="20" fill="#1e1e1e" text-anchor="start">7 generate</text><text x="610.0" y="345.0" font-size="14" fill="#1e1e1e" text-anchor="start">Nemotron 3 Super NIM</text><text x="610.0" y="362.5" font-size="14" fill="#1e1e1e" text-anchor="start">cite [n] or say</text><text x="610.0" y="380.0" font-size="14" fill="#1e1e1e" text-anchor="start">&quot;I don&#x27;t know&quot;</text><text x="20.0" y="446.0" font-size="16" fill="#1e1e1e" text-anchor="start">Yellow = where today&#x27;s stale-policy fix lives: a metadata filter at retrieval, not a prompt rule.</text></svg>