<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1019 445" width="1019" height="445" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1019" height="445" fill="#ffffff"/><rect x="20" y="50" width="440" height="330" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><ellipse cx="89.0" cy="199.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#ffd43b"/><ellipse cx="119.0" cy="259.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#69db7c"/><polyline points="120.0,245.0 98.0,212.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="108.0,218.6 98.0,212.0 100.2,223.8" fill="none" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="209.0" cy="299.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#ff8787"/><polyline points="212.0,296.0 290.0,330.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="278.0,329.9 290.0,330.0 281.7,321.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="500" y="50" width="440" height="330" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><ellipse cx="569.0" cy="199.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#ffd43b"/><ellipse cx="599.0" cy="239.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#69db7c"/><ellipse cx="609.0" cy="274.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#ced4da"/><ellipse cx="749.0" cy="329.0" rx="9.0" ry="9.0" stroke="#1e1e1e" stroke-width="2" fill="#ff8787"/><text x="20.0" y="30.0" font-size="20" fill="#1e1e1e" text-anchor="start">Milvus doesn&#x27;t understand meaning. The embedding model already put meaning into position.</text><text x="30.0" y="74.0" font-size="16" fill="#1e1e1e" text-anchor="start">TRAINING (contrastive, done by NVIDIA)</text><text x="30.0" y="99.0" font-size="14" fill="#1e1e1e" text-anchor="start">For millions of (question, right passage) pairs:</text><text x="30.0" y="116.5" font-size="14" fill="#1e1e1e" text-anchor="start">  pull q and its passage CLOSER</text><text x="30.0" y="134.0" font-size="14" fill="#1e1e1e" text-anchor="start">  push q and wrong passages APART</text><text x="104.0" y="202.0" font-size="14" fill="#1e1e1e" text-anchor="start">q: how fast to escalate?</text><text x="134.0" y="262.0" font-size="14" fill="#1e1e1e" text-anchor="start">p+: escalated within 24 hours</text><text x="30.0" y="238.0" font-size="13" fill="#1e1e1e" text-anchor="start">pull</text><text x="224.0" y="302.0" font-size="14" fill="#1e1e1e" text-anchor="start">p-: TBML invoice fraud</text><text x="300.0" y="338.0" font-size="13" fill="#1e1e1e" text-anchor="start">push apart</text><text x="30.0" y="359.0" font-size="14" fill="#1e1e1e" text-anchor="start">repeat millions of times -&gt; weights are frozen</text><text x="510.0" y="74.0" font-size="16" fill="#1e1e1e" text-anchor="start">SEARCH (Milvus, every question)</text><text x="510.0" y="99.0" font-size="14" fill="#1e1e1e" text-anchor="start">Pure geometry: measure the angle between</text><text x="510.0" y="116.5" font-size="14" fill="#1e1e1e" text-anchor="start">the query vector and every stored vector.</text><text x="584.0" y="202.0" font-size="14" fill="#1e1e1e" text-anchor="start">q</text><text x="614.0" y="242.0" font-size="14" fill="#1e1e1e" text-anchor="start">v2 policy (24h)  cos 0.98</text><text x="624.0" y="277.0" font-size="14" fill="#1e1e1e" text-anchor="start">v1 policy (72h)  cos 0.99</text><text x="764.0" y="332.0" font-size="14" fill="#1e1e1e" text-anchor="start">TBML chunk  cos 0.12</text><text x="510.0" y="359.0" font-size="14" fill="#1e1e1e" text-anchor="start">top-k = smallest angles. No words, no grammar.</text><text x="20.0" y="411.0" font-size="16" fill="#1e1e1e" text-anchor="start">Meaning lives in the coordinates (embedding model). Milvus only measures distance between them.</text></svg>