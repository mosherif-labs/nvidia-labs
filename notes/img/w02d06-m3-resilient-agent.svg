"/><polyline points="280.0,480.0 190.0,520.0" stroke="#15803d" stroke-width="2" fill="none"/><polyline points="198.2,511.2 190.0,520.0 202.0,519.8" fill="none" stroke="#15803d" stroke-width="2"/><polyline points="520.0,480.0 620.0,520.0" stroke="#b91c1c" stroke-width="2" fill="none"/><polyline points="608.0,520.2 620.0,520.0 611.5,511.6" fill="none" stroke="#b91c1c" stroke-width="2"/><rect x="40" y="520" width="300" height="52" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><rect x="460" y="520" width="320" height="52" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><text x="20.0" y="17.0" font-size="22" fill="#1e1e1e" text-anchor="start">Mission 3: what resilient_agent.py adds around the Day 4 loop</text><text x="242.0" y="61.0" font-size="18" fill="#1e1e1e" text-anchor="start">investigate(question, case_id)</text><text x="242.0" y="80.0" font-size="14" fill="#424242" text-anchor="start">resets degraded, counts dead letters</text><text x="34.0" y="132.0" font-size="16" fill="#5b21b6" text-anchor="start">Day 4 loop: agent.run()</text><text x="62.0" y="173.0" font-size="18" fill="#1e1e1e" text-anchor="start">main model</text><text x="62.0" y="192.0" font-size="14" fill="#424242" text-anchor="start">AGENT_MODEL (Nemotron 120B)</text><text x="210.0" y="228.0" font-size="14" fill="#b91c1c" text-anchor="start">2 timeouts / 429s / 5xx</text><text x="62.0" y="273.0" font-size="18" fill="#1e1e1e" text-anchor="start">FALLBACK_MODEL (smaller)</text><text x="62.0" y="292.0" font-size="14" fill="#424242" text-anchor="start">answer marked degraded</text><text x="210.0" y="324.0" font-size="14" fill="#b91c1c" text-anchor="start">fallback fails too</text><text x="62.0" y="370.0" font-size="18" fill="#1e1e1e" text-anchor="start">ModelUnavailable: stop the case</text><text x="452.0" y="173.0" font-size="18" fill="#1e1e1e" text-anchor="start">tool calls</text><text x="452.0" y="192.0" font-size="14" fill="#424242" text-anchor="start">resilient tools (Mission 2 layers)</text><text x="605.0" y="228.0" font-size="14" fill="#b91c1c" text-anchor="start">gave up / breaker open</text><text x="452.0" y="273.0" font-size="18" fill="#1e1e1e" text-anchor="start">dead letter</text><text x="452.0" y="292.0" font-size="14" fill="#424242" text-anchor="start">tool_failures += 1</text><text x="182.0" y="462.0" font-size="18" fill="#1e1e1e" text-anchor="start">answered AND no dead letters?</text><text x="180.0" y="502.0" font-size="16" fill="#15803d" text-anchor="start">yes</text><text x="590.0" y="502.0" font-size="16" fill="#b91c1c" text-anchor="start">no</text><text x="52.0" y="543.0" font-size="18" fill="#1e1e1e" text-anchor="start">answer to the analyst</text><text x="52.0" y="562.0" font-size="14" fill="#424242" text-anchor="start">degraded flag travels with it</text><text x="472.0" y="543.0" font-size="18" fill="#1e1e1e" text-anchor="start">needs_human.jsonl</text><text x="472.0" y="562.0" font-size="14" fill="#424242" text-anchor="start">case_id, steps, tools, reason</text></svg>