M</text><text x="1205.0" y="81.0" font-size="16" fill="#1e1e1e" text-anchor="middle">hosted or GPU pod</text><text x="395.8" y="108.6" font-size="13" fill="#1e1e1e" text-anchor="start">LPUSH (SET NX id)</text><text x="624.2" y="108.6" font-size="13" fill="#1e1e1e" text-anchor="start">BRPOP</text><text x="624.2" y="201.2" font-size="13" fill="#1e1e1e" text-anchor="start">publish</text><text x="395.8" y="201.2" font-size="13" fill="#1e1e1e" text-anchor="start">SSE</text><text x="990.0" y="154.9" font-size="13" fill="#1e1e1e" text-anchor="start">checkpoints</text><text x="1110.0" y="69.9" font-size="13" fill="#1e1e1e" text-anchor="start">LLM calls</text><text x="0.0" y="315.0" font-size="15" fill="#1e1e1e" text-anchor="start">API scales on CPU (HPA); workers scale on backlog (KEDA, to zero); a crash resumes from the checkpoint</text></svg>