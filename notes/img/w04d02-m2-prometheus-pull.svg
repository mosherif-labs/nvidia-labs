<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1070 368" width="1070" height="368" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="1070" height="368" fill="#ffffff"/><rect x="20" y="60" width="250" height="90" rx="0" stroke="#2f9e44" stroke-width="2" fill="#d3f9d8"/><rect x="20" y="180" width="250" height="90" rx="0" stroke="#2f9e44" stroke-width="2" fill="#d3f9d8"/><rect x="400" y="50" width="300" height="240" rx="0" stroke="#1971c2" stroke-width="2" fill="#d0ebff"/><polyline points="400.0,110.0 270.0,105.0" stroke="#1971c2" stroke-width="2" fill="none"/><polyline points="281.2,100.8 270.0,105.0 280.9,110.1" fill="none" stroke="#1971c2" stroke-width="2"/><polyline points="400.0,220.0 270.0,225.0" stroke="#1971c2" stroke-width="2" fill="none"/><polyline points="280.9,219.9 270.0,225.0 281.2,229.2" fill="none" stroke="#1971c2" stroke-width="2"/><rect x="820" y="50" width="230" height="100" rx="0" stroke="#f08c00" stroke-width="2" fill="#fff3bf"/><polyline points="820.0,100.0 700.0,100.0" stroke="#f08c00" stroke-width="2" fill="none"/><polyline points="711.1,95.3 700.0,100.0 711.1,104.7" fill="none" stroke="#f08c00" stroke-width="2"/><rect x="820" y="190" width="230" height="100" rx="0" stroke="#e03131" stroke-width="2" fill="#ffe3e3"/><polyline points="700.0,240.0 820.0,240.0" stroke="#e03131" stroke-width="2" fill="none"/><polyline points="808.9,244.7 820.0,240.0 808.9,235.3" fill="none" stroke="#e03131" stroke-width="2"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">Prometheus PULLS metrics, stores them, and checks alert rules</text><text x="35.0" y="84.0" font-size="14" fill="#1e1e1e" text-anchor="start">monitor.py  v1</text><text x="35.0" y="101.5" font-size="14" fill="#1e1e1e" text-anchor="start">GET :9101/metrics</text><text x="35.0" y="119.0" font-size="14" fill="#1e1e1e" text-anchor="start">agent_tasks_total{version=&quot;v1&quot;} 9</text><text x="35.0" y="204.0" font-size="14" fill="#1e1e1e" text-anchor="start">monitor.py  v2</text><text x="35.0" y="221.5" font-size="14" fill="#1e1e1e" text-anchor="start">GET :9102/metrics</text><text x="35.0" y="239.0" font-size="14" fill="#1e1e1e" text-anchor="start">(only counters + buckets)</text><text x="415.0" y="78.0" font-size="18" fill="#1971c2" text-anchor="start">Prometheus  :9090</text><text x="415.0" y="110.0" font-size="15" fill="#1e1e1e" text-anchor="start">1. scrape every 5 s (pull)</text><text x="415.0" y="128.8" font-size="15" fill="#1e1e1e" text-anchor="start">2. store each value with a</text><text x="415.0" y="147.5" font-size="15" fill="#1e1e1e" text-anchor="start">   timestamp (time-series DB)</text><text x="415.0" y="166.2" font-size="15" fill="#1e1e1e" text-anchor="start">3. PromQL: rate(), sum by,</text><text x="415.0" y="185.0" font-size="15" fill="#1e1e1e" text-anchor="start">   histogram_quantile()</text><text x="415.0" y="203.8" font-size="15" fill="#1e1e1e" text-anchor="start">4. evaluate alerts.yml</text><text x="415.0" y="222.5" font-size="15" fill="#1e1e1e" text-anchor="start">   every 15 s</text><text x="275.0" y="93.5" font-size="14" fill="#1971c2" text-anchor="start">scrape</text><text x="275.0" y="208.5" font-size="14" fill="#1971c2" text-anchor="start">scrape</text><text x="835.0" y="75.0" font-size="15" fill="#1e1e1e" text-anchor="start">Grafana  :3000</text><text x="835.0" y="93.8" font-size="15" fill="#1e1e1e" text-anchor="start">draws panels;</text><text x="835.0" y="112.5" font-size="15" fill="#1e1e1e" text-anchor="start">stores no metrics</text><text x="700.0" y="86.0" font-size="14" fill="#f08c00" text-anchor="start">PromQL query</text><text x="835.0" y="215.0" font-size="15" fill="#1e1e1e" text-anchor="start">/alerts page</text><text x="835.0" y="233.8" font-size="15" fill="#1e1e1e" text-anchor="start">inactive -&gt; pending</text><text x="835.0" y="252.5" font-size="15" fill="#1e1e1e" text-anchor="start">-&gt; firing</text><text x="700.0" y="226.0" font-size="14" fill="#e03131" text-anchor="start">rule true</text><text x="20.0" y="324.0" font-size="14" fill="#495057" text-anchor="start">Your app never pushes anything. It just exposes numbers on /metrics; Prometheus comes and reads them.</text></svg>