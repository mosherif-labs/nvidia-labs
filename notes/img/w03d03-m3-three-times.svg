<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 930 372" width="930" height="372" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="930" height="372" fill="#ffffff"/><rect x="20" y="50" width="280" height="240" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5"/><rect x="320" y="50" width="280" height="240" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff9db"/><rect x="620" y="50" width="280" height="240" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8"/><polyline points="300.0,170.0 320.0,170.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="308.9,174.7 320.0,170.0 308.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="600.0,170.0 620.0,170.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="608.9,174.7 620.0,170.0 608.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="20.0" y="32.0" font-size="22" fill="#1e1e1e" text-anchor="start">Embeddings: learned ONCE in training, then just CALLED by your code</text><text x="30.0" y="73.0" font-size="15" fill="#1e1e1e" text-anchor="start">A. TRAINING  (NVIDIA, months ago)</text><text x="30.0" y="109.0" font-size="14" fill="#1e1e1e" text-anchor="start">Millions of (question, passage)</text><text x="30.0" y="126.5" font-size="14" fill="#1e1e1e" text-anchor="start">pairs teach the model WEIGHTS:</text><text x="30.0" y="144.0" font-size="14" fill="#1e1e1e" text-anchor="start">how to turn any text into a</text><text x="30.0" y="161.5" font-size="14" fill="#1e1e1e" text-anchor="start">vector so similar meanings</text><text x="30.0" y="179.0" font-size="14" fill="#1e1e1e" text-anchor="start">land close together.</text><text x="30.0" y="196.5" font-size="14" fill="#1e1e1e" text-anchor="start"></text><text x="30.0" y="214.0" font-size="14" fill="#1e1e1e" text-anchor="start">Result: a frozen function</text><text x="30.0" y="231.5" font-size="14" fill="#1e1e1e" text-anchor="start">f(text) -&gt; 2048 numbers.</text><text x="30.0" y="249.0" font-size="14" fill="#1e1e1e" text-anchor="start">You never do this step.</text><text x="330.0" y="73.0" font-size="15" fill="#1e1e1e" text-anchor="start">B. INGEST (your code, once)</text><text x="330.0" y="109.0" font-size="14" fill="#1e1e1e" text-anchor="start">For each chunk of YOUR docs:</text><text x="330.0" y="126.5" font-size="14" fill="#1e1e1e" text-anchor="start">  v = f(chunk)   # NIM call</text><text x="330.0" y="144.0" font-size="14" fill="#1e1e1e" text-anchor="start">  Milvus.insert(v, text, status)</text><text x="330.0" y="161.5" font-size="14" fill="#1e1e1e" text-anchor="start"></text><text x="330.0" y="179.0" font-size="14" fill="#1e1e1e" text-anchor="start">Weights don&#x27;t change.</text><text x="330.0" y="196.5" font-size="14" fill="#1e1e1e" text-anchor="start">This is inference, not training:</text><text x="330.0" y="214.0" font-size="14" fill="#1e1e1e" text-anchor="start">like calling a hash function</text><text x="330.0" y="231.5" font-size="14" fill="#1e1e1e" text-anchor="start">and storing the result.</text><text x="630.0" y="73.0" font-size="15" fill="#1e1e1e" text-anchor="start">C. QUERY (your code, per question)</text><text x="630.0" y="109.0" font-size="14" fill="#1e1e1e" text-anchor="start">q = f(question)</text><text x="630.0" y="126.5" font-size="14" fill="#1e1e1e" text-anchor="start">hits = Milvus nearest(q, top 5,</text><text x="630.0" y="144.0" font-size="14" fill="#1e1e1e" text-anchor="start">         status == current)</text><text x="630.0" y="161.5" font-size="14" fill="#1e1e1e" text-anchor="start">prompt = hits + question</text><text x="630.0" y="179.0" font-size="14" fill="#1e1e1e" text-anchor="start">answer = LLM(prompt)</text><text x="630.0" y="196.5" font-size="14" fill="#1e1e1e" text-anchor="start"></text><text x="630.0" y="214.0" font-size="14" fill="#1e1e1e" text-anchor="start">The LLM never saw your docs</text><text x="630.0" y="231.5" font-size="14" fill="#1e1e1e" text-anchor="start">in training. It sees them</text><text x="630.0" y="249.0" font-size="14" fill="#1e1e1e" text-anchor="start">only in this prompt.</text><text x="20.0" y="320.0" font-size="15" fill="#1e1e1e" text-anchor="start">Don&#x27;t confuse: the LLM ALSO has an internal embedding layer (token embeddings, learned in its training).</text><text x="20.0" y="338.8" font-size="15" fill="#1e1e1e" text-anchor="start">That lives inside the LLM and isn&#x27;t searchable. RAG uses a SEPARATE embedding model + a vector DB you own.</text></svg>