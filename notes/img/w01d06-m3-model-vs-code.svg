<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 920 625" width="920" height="625" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m15803d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="m2563eb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/></marker><marker id="m7c3aed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker></defs><rect x="-30" y="-30" width="920" height="625" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">What the model sees vs what your code keeps</text><rect x="0" y="45" width="400" height="420" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1"/><text x="15" y="75" font-size="20" fill="#15803d" font-weight="600">Your machine</text><rect x="440" y="45" width="330" height="420" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-opacity="0.6" stroke-width="1"/><text x="455" y="75" font-size="20" fill="#2563eb" font-weight="600">Hosted NIM (NVIDIA cloud)</text><rect x="20" y="95" width="360" height="60" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="200.0" y="120.6" font-size="16" text-anchor="middle" fill="#1e1e1e">00-environment/.env -&gt; os.environ</text><text x="200.0" y="140.6" font-size="16" text-anchor="middle" fill="#1e1e1e">(NVIDIA_API_KEY, never committed)</text><rect x="20" y="175" width="360" height="60" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="200.0" y="200.6" font-size="16" text-anchor="middle" fill="#1e1e1e">client = OpenAI(base_url=NIM, api_key)</text><text x="200.0" y="220.6" font-size="16" text-anchor="middle" fill="#1e1e1e">OpenAI-compatible API, NVIDIA endpoint</text><rect x="20" y="255" width="170" height="90" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="105.0" y="285.6" font-size="16" text-anchor="middle" fill="#1e1e1e">TOOLS</text><text x="105.0" y="305.6" font-size="16" text-anchor="middle" fill="#1e1e1e">name -&gt; Python</text><text x="105.0" y="325.6" font-size="16" text-anchor="middle" fill="#1e1e1e">function</text><rect x="210" y="255" width="170" height="90" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="295.0" y="285.6" font-size="16" text-anchor="middle" fill="#1e1e1e">SCHEMAS</text><text x="295.0" y="305.6" font-size="16" text-anchor="middle" fill="#1e1e1e">name + description</text><text x="295.0" y="325.6" font-size="16" text-anchor="middle" fill="#1e1e1e">+ JSON args</text><rect x="20" y="365" width="360" height="80" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="200.0" y="400.6" font-size="16" text-anchor="middle" fill="#1e1e1e">run() loop: MAX_STEPS = 8 (env override)</text><text x="200.0" y="420.6" font-size="16" text-anchor="middle" fill="#1e1e1e">executes TOOLS[name](**args) locally</text><rect x="460" y="175" width="290" height="170" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="605.0" y="225.6" font-size="16" text-anchor="middle" fill="#1e1e1e">MODEL</text><text x="605.0" y="245.6" font-size="16" text-anchor="middle" fill="#1e1e1e">nemotron-3.5-super-vl-120b-a12b</text><text x="605.0" y="265.6" font-size="16" text-anchor="middle" fill="#1e1e1e">sees: SYSTEM prompt,</text><text x="605.0" y="285.6" font-size="16" text-anchor="middle" fill="#1e1e1e">messages, SCHEMAS</text><text x="605.0" y="305.6" font-size="16" text-anchor="middle" fill="#1e1e1e">never runs your code</text><polyline points="380,205 460,205" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><polyline points="380,300 460,300" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m7c3aed)"/><rect x="400.6" y="289.5" width="38.800000000000004" height="21.0" fill="#ffffff"/><text x="420.0" y="304.9" font-size="14" text-anchor="middle" fill="#7c3aed">sent</text><polyline points="605,345 605,405 380,405" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m15803d)"/><rect x="485.5" y="364.5" width="239.00000000000003" height="21.0" fill="#ffffff"/><text x="605.0" y="379.9" font-size="14" text-anchor="middle" fill="#15803d">tool_calls: name + args (text)</text><rect x="0" y="485" width="770" height="80" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="520.6" font-size="16" text-anchor="middle" fill="#1e1e1e">The model only REQUESTS a tool by name; your loop decides whether to run it.</text><text x="385.0" y="540.6" font-size="16" text-anchor="middle" fill="#1e1e1e">That gap is where validation, approval gates and guardrails live (AAI 5.x, 10.4).</text></svg>