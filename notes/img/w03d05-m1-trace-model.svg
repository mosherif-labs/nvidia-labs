<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1100 520" width="1100" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="1100" height="520" fill="#ffffff"/><rect x="20" y="50" width="700" height="430" rx="12" stroke="#1971c2" stroke-width="2" fill="#e7f5ff"/><rect x="45" y="100" width="650" height="360" rx="12" stroke="#e8590c" stroke-width="2" fill="#fff4e6"/><rect x="70" y="170" width="600" height="270" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><rect x="95" y="220" width="260" height="90" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff"/><rect x="380" y="220" width="270" height="90" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff" stroke-dasharray="8 6"/><rect x="750" y="50" width="330" height="430" rx="12" stroke="#6741d9" stroke-width="2" fill="#f3f0ff"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">How a trace is organised (LangSmith terms = OpenTelemetry / Phoenix terms)</text><text x="40.0" y="80.0" font-size="18" fill="#1971c2" text-anchor="start">PROJECT  = all traces of one app   (Phoenix project: aai-agent)</text><text x="65.0" y="128.0" font-size="16" fill="#e8590c" text-anchor="start">THREAD  = traces of one session/conversation</text><text x="65.0" y="148.0" font-size="16" fill="#e8590c" text-anchor="start">(LangSmith: thread_id metadata · Phoenix: session_id)</text><text x="90.0" y="198.0" font-size="16" fill="#2f9e44" text-anchor="start">TRACE  = all runs of ONE operation (one case), shared trace id</text><text x="110.0" y="248.0" font-size="16" fill="#1e1e1e" text-anchor="start">ROOT run (AGENT)</text><text x="110.0" y="268.0" font-size="16" fill="#1e1e1e" text-anchor="start">case case-15a</text><text x="395.0" y="248.0" font-size="16" fill="#1e1e1e" text-anchor="start">child runs = spans</text><text x="395.0" y="268.0" font-size="16" fill="#1e1e1e" text-anchor="start">LLM calls · tool calls</text><text x="395.0" y="288.0" font-size="16" fill="#1e1e1e" text-anchor="start">(how many? = Bet A)</text><text x="95.0" y="345.0" font-size="15" fill="#1e1e1e" text-anchor="start">RUN = SPAN: one unit of work (model call, tool call,</text><text x="95.0" y="363.8" font-size="15" fill="#1e1e1e" text-anchor="start">retrieval, prompt formatting). Children nest under the root.</text><text x="770.0" y="80.0" font-size="18" fill="#6741d9" text-anchor="start">ENRICHMENT (on runs)</text><text x="770.0" y="121.0" font-size="16" fill="#1e1e1e" text-anchor="start">TAGS: plain strings</text><text x="770.0" y="141.0" font-size="16" fill="#1e1e1e" text-anchor="start">[&quot;aai&quot;, &quot;day15&quot;]</text><text x="770.0" y="161.0" font-size="16" fill="#1e1e1e" text-anchor="start">-&gt; filter / group</text><text x="770.0" y="231.0" font-size="16" fill="#1e1e1e" text-anchor="start">METADATA: key-value</text><text x="770.0" y="251.0" font-size="16" fill="#1e1e1e" text-anchor="start">{case_id, model, version, env}</text><text x="770.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="start">-&gt; filter / group</text><text x="770.0" y="341.0" font-size="16" fill="#1e1e1e" text-anchor="start">FEEDBACK: a score</text><text x="770.0" y="361.0" font-size="16" fill="#1e1e1e" text-anchor="start">(key + score) bound to</text><text x="770.0" y="381.0" font-size="16" fill="#1e1e1e" text-anchor="start">a run by its RUN ID</text><text x="770.0" y="401.0" font-size="16" fill="#1e1e1e" text-anchor="start">-&gt; quality, evals</text></svg>