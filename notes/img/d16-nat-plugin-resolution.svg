<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 926 402" width="926" height="402" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="926" height="402" fill="#ffffff"/><rect x="20" y="60" width="250" height="110" rx="12" stroke="#1971c2" stroke-width="2" fill="#e7f5ff"/><polyline points="275.0,115.0 315.0,115.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="303.9,119.7 315.0,115.0 303.9,110.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="320" y="60" width="250" height="110" rx="12" stroke="#9c36b5" stroke-width="2" fill="#f8f0fc"/><polyline points="575.0,115.0 615.0,115.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="603.9,119.7 615.0,115.0 603.9,110.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="620" y="60" width="250" height="110" rx="12" stroke="#e8590c" stroke-width="2" fill="#fff4e6"/><polyline points="745.0,175.0 745.0,215.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="740.3,203.9 745.0,215.0 749.7,203.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="620" y="220" width="250" height="120" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><polyline points="615.0,280.0 575.0,280.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="586.1,275.3 575.0,280.0 586.1,284.7" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="320" y="220" width="250" height="120" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><rect x="20" y="220" width="250" height="120" rx="12" stroke="#1971c2" stroke-width="2" fill="none"/><polyline points="275.0,280.0 315.0,280.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="303.9,284.7 315.0,280.0 303.9,275.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="20.0" y="30.0" font-size="20" fill="#1e1e1e" text-anchor="start">How `_type: react_agent` becomes a LangGraph agent with a LangChain ChatNVIDIA</text><text x="145.0" y="92.5" font-size="15" fill="#1971c2" text-anchor="middle">1 · pip install</text><text x="145.0" y="111.2" font-size="15" fill="#1971c2" text-anchor="middle">nvidia-nat[langchain]</text><text x="145.0" y="130.0" font-size="15" fill="#1971c2" text-anchor="middle">entry_points.txt:</text><text x="145.0" y="148.8" font-size="15" fill="#1971c2" text-anchor="middle">[nat.components] nat_langchain</text><text x="445.0" y="92.5" font-size="15" fill="#9c36b5" text-anchor="middle">2 · NAT starts</text><text x="445.0" y="111.2" font-size="15" fill="#9c36b5" text-anchor="middle">loader.py imports every</text><text x="445.0" y="130.0" font-size="15" fill="#9c36b5" text-anchor="middle">[nat.components] module</text><text x="445.0" y="148.8" font-size="15" fill="#9c36b5" text-anchor="middle">→ decorators fill registry</text><text x="745.0" y="92.5" font-size="15" fill="#e8590c" text-anchor="middle">3 · registry</text><text x="745.0" y="111.2" font-size="15" fill="#e8590c" text-anchor="middle">&quot;react_agent&quot; →</text><text x="745.0" y="130.0" font-size="15" fill="#e8590c" text-anchor="middle">react_agent_workflow</text><text x="745.0" y="148.8" font-size="15" fill="#e8590c" text-anchor="middle">wrappers=[LANGCHAIN]</text><text x="745.0" y="248.1" font-size="15" fill="#2f9e44" text-anchor="middle">4 · build</text><text x="745.0" y="266.9" font-size="15" fill="#2f9e44" text-anchor="middle">builder.get_llm(nim_llm,</text><text x="745.0" y="285.6" font-size="15" fill="#2f9e44" text-anchor="middle"> wrapper_type=LANGCHAIN)</text><text x="745.0" y="304.4" font-size="15" fill="#2f9e44" text-anchor="middle">→ nim_langchain() → ChatNVIDIA</text><text x="745.0" y="323.1" font-size="15" fill="#2f9e44" text-anchor="middle">tools → LangChain tools</text><text x="445.0" y="266.9" font-size="15" fill="#1e1e1e" text-anchor="middle">5 · ReActAgentGraph</text><text x="445.0" y="285.6" font-size="15" fill="#1e1e1e" text-anchor="middle">(llm, tools).build_graph()</text><text x="445.0" y="304.4" font-size="15" fill="#1e1e1e" text-anchor="middle">→ compiled LangGraph</text><text x="145.0" y="257.5" font-size="15" fill="#1971c2" text-anchor="middle">config.yml</text><text x="145.0" y="276.2" font-size="15" fill="#1971c2" text-anchor="middle">llms.nim_llm: _type: nim</text><text x="145.0" y="295.0" font-size="15" fill="#1971c2" text-anchor="middle">workflow: _type: react_agent</text><text x="145.0" y="313.8" font-size="15" fill="#1971c2" text-anchor="middle">(no mention of LangChain)</text><text x="20.0" y="369.0" font-size="14" fill="#495057" text-anchor="start">The config names types; the installed plugin decides the framework. Uninstall the plugin → &quot;react_agent&quot; not found.</text></svg>