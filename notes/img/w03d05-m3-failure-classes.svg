<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 945 538" width="945" height="538" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="945" height="538" fill="#ffffff"/><rect x="20" y="55" width="470" height="100" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><polyline points="495.0,105.0 590.0,105.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="578.9,109.7 590.0,105.0 578.9,100.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="595" y="55" width="330" height="100" rx="12" stroke="#e03131" stroke-width="2" fill="#ffe3e3"/><polyline points="255.0,157.0 255.0,193.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="250.3,181.9 255.0,193.0 259.7,181.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="195" width="470" height="100" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><polyline points="495.0,245.0 590.0,245.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="578.9,249.7 590.0,245.0 578.9,240.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="595" y="195" width="330" height="100" rx="12" stroke="#f08c00" stroke-width="2" fill="#fff3bf"/><polyline points="255.0,297.0 255.0,333.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="250.3,321.9 255.0,333.0 259.7,321.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="335" width="470" height="100" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><polyline points="495.0,385.0 590.0,385.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="578.9,389.7 590.0,385.0 578.9,380.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="595" y="335" width="330" height="100" rx="12" stroke="#6741d9" stroke-width="2" fill="#e5dbff"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">Reading a failed trace: ask 3 questions, in this order</text><text x="35.0" y="86.0" font-size="16" fill="#1e1e1e" text-anchor="start">1. Does any span carry an ERROR / exception?</text><text x="35.0" y="130.0" font-size="13" fill="#495057" text-anchor="start">(status ERROR, HTTP 404/429/timeout, error.type)</text><text x="520.0" y="94.0" font-size="14" fill="#2f9e44" text-anchor="start">yes</text><text x="610.0" y="85.0" font-size="18" fill="#e03131" text-anchor="start">ENVIRONMENT</text><text x="610.0" y="114.0" font-size="14" fill="#1e1e1e" text-anchor="start">infra failed: endpoint, network,</text><text x="610.0" y="131.5" font-size="14" fill="#1e1e1e" text-anchor="start">rate limit, auth, timeout</text><text x="265.0" y="177.0" font-size="14" fill="#e03131" text-anchor="start">no</text><text x="35.0" y="226.0" font-size="16" fill="#1e1e1e" text-anchor="start">2. Is a NEEDED tool span missing, or given wrong input?</text><text x="35.0" y="270.0" font-size="13" fill="#495057" text-anchor="start">(tool.* missing, wrong tool, bad arguments)</text><text x="520.0" y="234.0" font-size="14" fill="#2f9e44" text-anchor="start">yes</text><text x="610.0" y="225.0" font-size="18" fill="#f08c00" text-anchor="start">TOOL MISUSE</text><text x="610.0" y="254.0" font-size="14" fill="#1e1e1e" text-anchor="start">skipped / wrong tool / bad args;</text><text x="610.0" y="271.5" font-size="14" fill="#1e1e1e" text-anchor="start">evidence = absence or wrong input</text><text x="265.0" y="317.0" font-size="14" fill="#e03131" text-anchor="start">no</text><text x="35.0" y="366.0" font-size="16" fill="#1e1e1e" text-anchor="start">3. Tools returned the right data, but the answer</text><text x="35.0" y="386.0" font-size="16" fill="#1e1e1e" text-anchor="start">    contradicts or ignores it?</text><text x="35.0" y="416.0" font-size="13" fill="#495057" text-anchor="start">(compare tool output.value vs final LLM output)</text><text x="520.0" y="374.0" font-size="14" fill="#2f9e44" text-anchor="start">yes</text><text x="610.0" y="365.0" font-size="18" fill="#6741d9" text-anchor="start">REASONING</text><text x="610.0" y="394.0" font-size="14" fill="#1e1e1e" text-anchor="start">right inputs, wrong conclusion;</text><text x="610.0" y="411.5" font-size="14" fill="#1e1e1e" text-anchor="start">evidence = output vs tool data</text><text x="20.0" y="494.0" font-size="14" fill="#495057" text-anchor="start">Order matters: an environment error can LOOK like tool misuse (no tool span), so rule it out first.</text></svg>