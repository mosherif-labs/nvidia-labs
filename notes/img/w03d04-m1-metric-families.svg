"middle">Trajectory</text><text x="455.0" y="103.0" font-size="18" fill="#1e1e1e" text-anchor="middle">reads the STEPS</text><text x="455.0" y="173.5" font-size="16" fill="#1e1e1e" text-anchor="middle">Tool correctness</text><text x="455.0" y="193.5" font-size="16" fill="#1e1e1e" text-anchor="middle">(required tools called)</text><text x="455.0" y="263.5" font-size="16" fill="#1e1e1e" text-anchor="middle">Step efficiency</text><text x="455.0" y="283.5" font-size="16" fill="#1e1e1e" text-anchor="middle">(expected ÷ actual calls)</text><text x="455.0" y="353.5" font-size="16" fill="#1e1e1e" text-anchor="middle">Loops</text><text x="455.0" y="373.5" font-size="16" fill="#1e1e1e" text-anchor="middle">(same tool+args twice)</text><text x="755.0" y="80.5" font-size="18" fill="#1e1e1e" text-anchor="middle">Operational</text><text x="755.0" y="103.0" font-size="18" fill="#1e1e1e" text-anchor="middle">reads the CLOCK / BILL</text><text x="755.0" y="183.5" font-size="16" fill="#1e1e1e" text-anchor="middle">p95 latency</text><text x="755.0" y="273.5" font-size="16" fill="#1e1e1e" text-anchor="middle">Cost per case</text><text x="20.0" y="446.0" font-size="16" fill="#c92a2a" text-anchor="start">Right answer, wrong path: guessed from prior knowledge, never called the tool</text><text x="20.0" y="471.0" font-size="16" fill="#c92a2a" text-anchor="start">→ passes final-answer, FAILS trajectory (tool correctness)</text></svg>