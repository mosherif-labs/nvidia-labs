<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1116 515" width="1116" height="515" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1116" height="515" fill="#ffffff"/><polyline points="80.0,400.0 640.0,400.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="628.9,404.7 640.0,400.0 628.9,395.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="80.0,400.0 80.0,60.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="84.7,71.1 80.0,60.0 75.3,71.1" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="140.0,300.0 250.0,170.0 420.0,100.0" stroke="#2f9e44" stroke-width="2" fill="none" stroke-dasharray="8 6"/><ellipse cx="140.0" cy="300.0" rx="9.0" ry="9.0" stroke="#2f9e44" stroke-width="2" fill="#2f9e44"/><ellipse cx="250.0" cy="170.0" rx="9.0" ry="9.0" stroke="#2f9e44" stroke-width="2" fill="#2f9e44"/><ellipse cx="420.0" cy="100.0" rx="9.0" ry="9.0" stroke="#2f9e44" stroke-width="2" fill="#2f9e44"/><ellipse cx="380.0" cy="260.0" rx="9.0" ry="9.0" stroke="#868e96" stroke-width="2" fill="#868e96"/><ellipse cx="540.0" cy="180.0" rx="9.0" ry="9.0" stroke="#868e96" stroke-width="2" fill="#868e96"/><polyline points="370.0,250.0 265.0,180.0" stroke="#868e96" stroke-width="2" fill="none"/><polyline points="276.8,182.2 265.0,180.0 271.6,190.0" fill="none" stroke="#868e96" stroke-width="2"/><text x="20.0" y="30.0" font-size="20" fill="#1e1e1e" text-anchor="start">Pareto front: success ↑ vs LLM calls ↓</text><text x="470.0" y="424.0" font-size="14" fill="#495057" text-anchor="start">mean LLM calls per task →</text><text x="470.0" y="441.5" font-size="14" fill="#495057" text-anchor="start">(lower is cheaper)</text><text x="20.0" y="54.0" font-size="14" fill="#495057" text-anchor="start">success ↑</text><text x="154.0" y="304.0" font-size="14" fill="#2f9e44" text-anchor="start">A: 60%, 2.0 calls (cost first)</text><text x="264.0" y="174.0" font-size="14" fill="#2f9e44" text-anchor="start">B: 80%, 3.0 calls</text><text x="434.0" y="104.0" font-size="14" fill="#2f9e44" text-anchor="start">C: 100%, 5.0 calls (accuracy first)</text><text x="394.0" y="264.0" font-size="14" fill="#868e96" text-anchor="start">D: 60%, 4.5 calls</text><text x="554.0" y="184.0" font-size="14" fill="#868e96" text-anchor="start">E: 80%, 6.0 calls</text><text x="300.0" y="238.0" font-size="13" fill="#868e96" text-anchor="start">dominated by B</text><text x="80.0" y="464.0" font-size="14" fill="#495057" text-anchor="start">Green = study.best_trials: no other trial is better on one objective without being worse on the other.</text><text x="80.0" y="481.5" font-size="14" fill="#495057" text-anchor="start">Grey = dominated: some trial beats it on both (or ties one, beats the other). You pick ON the front; where depends on your priority.</text></svg>