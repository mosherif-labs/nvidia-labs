<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 977 600" width="977" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="977" height="600" fill="#ffffff"/><rect x="20" y="50" width="330" height="250" rx="12" stroke="#1971c2" stroke-width="2" fill="#e7f5ff"/><rect x="390" y="50" width="560" height="250" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><rect x="410" y="95" width="165" height="125" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ffffff"/><rect x="585" y="95" width="165" height="125" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ffffff"/><rect x="760" y="95" width="170" height="125" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ffffff"/><rect x="20" y="330" width="450" height="140" rx="12" stroke="#f08c00" stroke-width="2" fill="#fff9db"/><rect x="500" y="330" width="450" height="140" rx="12" stroke="#6741d9" stroke-width="2" fill="#f3f0ff"/><rect x="20" y="500" width="930" height="60" rx="12" stroke="#e03131" stroke-width="2" fill="#fff5f5" stroke-dasharray="8 6"/><text x="20.0" y="24.0" font-size="24" fill="#1e1e1e" text-anchor="start">Agent memory map (AML investigator agent)</text><text x="40.0" y="80.0" font-size="18" fill="#1971c2" text-anchor="start">SHORT-TERM  (one thread)</text><text x="40.0" y="110.0" font-size="15" fill="#1e1e1e" text-anchor="start">The chat so far, in the agent&#x27;s state</text><text x="40.0" y="128.8" font-size="15" fill="#1e1e1e" text-anchor="start">Saved by the checkpointer (Day 12)</text><text x="40.0" y="147.5" font-size="15" fill="#1e1e1e" text-anchor="start"></text><text x="40.0" y="166.2" font-size="15" fill="#1e1e1e" text-anchor="start">Keep it small:</text><text x="40.0" y="185.0" font-size="15" fill="#1e1e1e" text-anchor="start">- buffer: keep every turn</text><text x="40.0" y="203.8" font-size="15" fill="#1e1e1e" text-anchor="start">- summary: one running summary</text><text x="40.0" y="222.5" font-size="15" fill="#1e1e1e" text-anchor="start">- summary + buffer: summary</text><text x="40.0" y="241.2" font-size="15" fill="#1e1e1e" text-anchor="start">  + last N turns verbatim</text><text x="410.0" y="80.0" font-size="18" fill="#2f9e44" text-anchor="start">LONG-TERM  (across threads, in namespaces)</text><text x="420.0" y="117.0" font-size="14" fill="#1e1e1e" text-anchor="start">SEMANTIC = facts</text><text x="420.0" y="134.5" font-size="14" fill="#1e1e1e" text-anchor="start"></text><text x="420.0" y="152.0" font-size="14" fill="#1e1e1e" text-anchor="start">ACC-11&#x27;s owner</text><text x="420.0" y="169.5" font-size="14" fill="#1e1e1e" text-anchor="start">also controls</text><text x="420.0" y="187.0" font-size="14" fill="#1e1e1e" text-anchor="start">Orbit Trading</text><text x="595.0" y="117.0" font-size="14" fill="#1e1e1e" text-anchor="start">EPISODIC = what</text><text x="595.0" y="134.5" font-size="14" fill="#1e1e1e" text-anchor="start">happened</text><text x="595.0" y="152.0" font-size="14" fill="#1e1e1e" text-anchor="start">A-1001 -&gt; escalated</text><text x="595.0" y="169.5" font-size="14" fill="#1e1e1e" text-anchor="start">as structuring</text><text x="595.0" y="187.0" font-size="14" fill="#1e1e1e" text-anchor="start">(few-shot examples)</text><text x="770.0" y="117.0" font-size="14" fill="#1e1e1e" text-anchor="start">PROCEDURAL = rules</text><text x="770.0" y="134.5" font-size="14" fill="#1e1e1e" text-anchor="start"></text><text x="770.0" y="152.0" font-size="14" fill="#1e1e1e" text-anchor="start">POL-05 in the</text><text x="770.0" y="169.5" font-size="14" fill="#1e1e1e" text-anchor="start">system prompt,</text><text x="770.0" y="187.0" font-size="14" fill="#1e1e1e" text-anchor="start">code, weights</text><text x="410.0" y="246.0" font-size="14" fill="#1e1e1e" text-anchor="start">Vector memory: search by meaning</text><text x="410.0" y="263.5" font-size="14" fill="#1e1e1e" text-anchor="start">Time-weighted retriever: similarity + (1-decay)^hours since last access</text><text x="40.0" y="360.0" font-size="18" fill="#f08c00" text-anchor="start">WHO SEES IT</text><text x="40.0" y="387.0" font-size="15" fill="#1e1e1e" text-anchor="start">Per-analyst: preferences</text><text x="40.0" y="405.8" font-size="15" fill="#1e1e1e" text-anchor="start">  namespace (&quot;analyst&quot;, user_id)</text><text x="40.0" y="424.5" font-size="15" fill="#1e1e1e" text-anchor="start">Shared: entity facts, lessons from closed cases</text><text x="40.0" y="443.2" font-size="15" fill="#1e1e1e" text-anchor="start">  shared data = access control!</text><text x="520.0" y="360.0" font-size="18" fill="#6741d9" text-anchor="start">WHEN IT&#x27;S WRITTEN</text><text x="520.0" y="387.0" font-size="15" fill="#1e1e1e" text-anchor="start">Hot path: before answering</text><text x="520.0" y="405.8" font-size="15" fill="#1e1e1e" text-anchor="start">  usable next turn, adds latency</text><text x="520.0" y="424.5" font-size="15" fill="#1e1e1e" text-anchor="start">Background: separate job later</text><text x="520.0" y="443.2" font-size="15" fill="#1e1e1e" text-anchor="start">  no latency, not available at once</text><text x="40.0" y="527.0" font-size="15" fill="#e03131" text-anchor="start">FORGET / CONSOLIDATE: decay, TTLs, deletion for retention rules  |  many episodes -&gt; one fact</text></svg>