<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 702 611" width="702" height="611" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="702" height="611" fill="#ffffff"/><rect x="20" y="45" width="330" height="58" rx="12" stroke="#4a9eed" stroke-width="2" fill="#a5d8ff"/><polyline points="185.0,103.0 185.0,123.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,111.9 185.0,123.0 189.7,111.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="123" width="330" height="58" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><polyline points="350.0,152.0 410.0,152.0" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="398.9,156.7 410.0,152.0 398.9,147.3" fill="none" stroke="#b91c1c" stroke-width="2"/><polyline points="185.0,181.0 185.0,201.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,189.9 185.0,201.0 189.7,189.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="201" width="330" height="58" rx="12" stroke="#f59e0b" stroke-width="2" fill="#ffd8a8"/><polyline points="350.0,230.0 410.0,230.0" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="398.9,234.7 410.0,230.0 398.9,225.3" fill="none" stroke="#b91c1c" stroke-width="2"/><polyline points="185.0,259.0 185.0,279.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,267.9 185.0,279.0 189.7,267.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="279" width="330" height="58" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><polyline points="185.0,337.0 185.0,357.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,345.9 185.0,357.0 189.7,345.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="357" width="330" height="58" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><polyline points="350.0,386.0 410.0,386.0" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="398.9,390.7 410.0,386.0 398.9,381.3" fill="none" stroke="#b91c1c" stroke-width="2"/><polyline points="185.0,415.0 185.0,435.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,423.9 185.0,435.0 189.7,423.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="435" width="330" height="58" rx="12" stroke="#ec4899" stroke-width="2" fill="#eebefa"/><polyline points="185.0,493.0 185.0,513.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="180.3,501.9 185.0,513.0 189.7,501.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="513" width="330" height="58" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">One tool call, layer by layer (outside in)</text><text x="34.0" y="69.0" font-size="18" fill="#1e1e1e" text-anchor="start">Model</text><text x="34.0" y="89.0" font-size="14" fill="#424242" text-anchor="start">asks: get_alert(alert_id=&quot;A-1001&quot;)</text><text x="34.0" y="147.0" font-size="18" fill="#1e1e1e" text-anchor="start">registry.call</text><text x="34.0" y="167.0" font-size="14" fill="#424242" text-anchor="start">checks the arguments (pydantic)</text><text x="418.0" y="151.0" font-size="16" fill="#b91c1c" text-anchor="start">bad args? error goes straight</text><text x="418.0" y="171.0" font-size="16" fill="#b91c1c" text-anchor="start">back to the model. Stops here.</text><text x="34.0" y="225.0" font-size="18" fill="#1e1e1e" text-anchor="start">call()  - safety net</text><text x="34.0" y="245.0" font-size="14" fill="#424242" text-anchor="start">catches anything that failed below</text><text x="418.0" y="229.0" font-size="16" fill="#b91c1c" text-anchor="start">writes a dead letter, returns</text><text x="418.0" y="249.0" font-size="16" fill="#b91c1c" text-anchor="start">&quot;ERROR: get_alert unavailable&quot;</text><text x="34.0" y="303.0" font-size="18" fill="#1e1e1e" text-anchor="start">attempt()  - tenacity</text><text x="34.0" y="323.0" font-size="14" fill="#424242" text-anchor="start">503 / timeout? random wait, retry (max 3)</text><text x="34.0" y="381.0" font-size="18" fill="#1e1e1e" text-anchor="start">breaker.call</text><text x="34.0" y="401.0" font-size="14" fill="#424242" text-anchor="start">known to be down? refuse instantly</text><text x="418.0" y="385.0" font-size="16" fill="#b91c1c" text-anchor="start">open? CircuitOpenError,</text><text x="418.0" y="405.0" font-size="16" fill="#b91c1c" text-anchor="start">no retry, straight to call()</text><text x="34.0" y="459.0" font-size="18" fill="#1e1e1e" text-anchor="start">chaos()</text><text x="34.0" y="479.0" font-size="14" fill="#424242" text-anchor="start">rolls a die: 30% fake 503</text><text x="34.0" y="537.0" font-size="18" fill="#1e1e1e" text-anchor="start">real tool</text><text x="34.0" y="557.0" font-size="14" fill="#424242" text-anchor="start">day2.get_alert(...)</text></svg>