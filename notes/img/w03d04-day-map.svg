<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1137 559" width="1137" height="559" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-20" width="1137" height="559" fill="#ffffff"/><rect x="20" y="50" width="1000" height="60" rx="12" stroke="#495057" stroke-width="2" fill="#f1f3f5"/><rect x="20" y="140" width="320" height="80" rx="12" stroke="#2f9e44" stroke-width="2" fill="#d3f9d8"/><rect x="20" y="240" width="320" height="110" rx="12" stroke="#2f9e44" stroke-width="2" fill="none"/><polyline points="180.0,110.0 180.0,138.0" stroke="#868e96" stroke-width="2" fill="none"/><polyline points="175.3,126.9 180.0,138.0 184.7,126.9" fill="none" stroke="#868e96" stroke-width="2"/><rect x="365" y="140" width="320" height="80" rx="12" stroke="#1971c2" stroke-width="2" fill="#d0ebff"/><rect x="365" y="240" width="320" height="110" rx="12" stroke="#1971c2" stroke-width="2" fill="none"/><polyline points="525.0,110.0 525.0,138.0" stroke="#868e96" stroke-width="2" fill="none"/><polyline points="520.3,126.9 525.0,138.0 529.7,126.9" fill="none" stroke="#868e96" stroke-width="2"/><rect x="710" y="140" width="320" height="80" rx="12" stroke="#9c36b5" stroke-width="2" fill="#f3d9fa"/><rect x="710" y="240" width="320" height="110" rx="12" stroke="#9c36b5" stroke-width="2" fill="none"/><polyline points="870.0,110.0 870.0,138.0" stroke="#868e96" stroke-width="2" fill="none"/><polyline points="865.3,126.9 870.0,138.0 874.7,126.9" fill="none" stroke="#868e96" stroke-width="2"/><rect x="20" y="390" width="1000" height="90" rx="12" stroke="#e8590c" stroke-width="2" fill="#ffe8cc"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">Day 14 in one picture: your agent&#x27;s report card asks 3 questions, then checks the grader</text><text x="520.0" y="76.2" font-size="15" fill="#1e1e1e" text-anchor="middle">g01: &quot;Sum the amounts in alert A-1001. Which policy matches, what action?&quot;</text><text x="520.0" y="95.0" font-size="15" fill="#1e1e1e" text-anchor="middle">expected: 28500 · POL-01 · escalate      required tools: get_alert, search_policy</text><text x="180.0" y="166.9" font-size="15" fill="#1e1e1e" text-anchor="middle">Q1  Is the answer right?</text><text x="180.0" y="185.6" font-size="15" fill="#1e1e1e" text-anchor="middle">Day 8 already did this</text><text x="180.0" y="204.4" font-size="15" fill="#1e1e1e" text-anchor="middle">(1 run → 1 number)</text><text x="180.0" y="281.9" font-size="15" fill="#1e1e1e" text-anchor="middle">answer has 28500,</text><text x="180.0" y="300.6" font-size="15" fill="#1e1e1e" text-anchor="middle">POL-01, escalate?</text><text x="180.0" y="319.4" font-size="15" fill="#1e1e1e" text-anchor="middle">→ success: PASS</text><text x="525.0" y="166.9" font-size="15" fill="#1e1e1e" text-anchor="middle">Q2  Was the PATH right?</text><text x="525.0" y="185.6" font-size="15" fill="#1e1e1e" text-anchor="middle">Mission 1 + run_eval3.py</text><text x="525.0" y="204.4" font-size="15" fill="#1e1e1e" text-anchor="middle">(trajectory metrics)</text><text x="525.0" y="272.5" font-size="15" fill="#1e1e1e" text-anchor="middle">called get_alert AND</text><text x="525.0" y="291.2" font-size="15" fill="#1e1e1e" text-anchor="middle">search_policy? (tool_ok)</text><text x="525.0" y="310.0" font-size="15" fill="#1e1e1e" text-anchor="middle">no wasted calls? (efficiency)</text><text x="525.0" y="328.8" font-size="15" fill="#1e1e1e" text-anchor="middle">no repeats? (loops)</text><text x="870.0" y="166.9" font-size="15" fill="#1e1e1e" text-anchor="middle">Q3  Is it right EVERY time?</text><text x="870.0" y="185.6" font-size="15" fill="#1e1e1e" text-anchor="middle">Mission 2: run 3×</text><text x="870.0" y="204.4" font-size="15" fill="#1e1e1e" text-anchor="middle">→ mean ± 95% CI</text><text x="870.0" y="272.5" font-size="15" fill="#1e1e1e" text-anchor="middle">run1 PASS · run2 FAIL · run3 PASS</text><text x="870.0" y="291.2" font-size="15" fill="#1e1e1e" text-anchor="middle">→ g01 is FLAKY</text><text x="870.0" y="310.0" font-size="15" fill="#1e1e1e" text-anchor="middle">e.g. success = 80% ± 12</text><text x="870.0" y="328.8" font-size="15" fill="#1e1e1e" text-anchor="middle">(that ± is Bet A)</text><text x="520.0" y="421.9" font-size="15" fill="#1e1e1e" text-anchor="middle">Q4  Who grades the path?  (Missions 3–4: nat eval)</text><text x="520.0" y="440.6" font-size="15" fill="#1e1e1e" text-anchor="middle">YOUR RULE  tool_ok = &quot;were the required tool names called?&quot;  — strict, cheap, blind to order/args</text><text x="520.0" y="459.4" font-size="15" fill="#1e1e1e" text-anchor="middle">NAT&#x27;S JUDGE  an LLM reads the steps → 0–1 score  — sees nuance, but can be lenient/inconsistent</text><text x="20.0" y="515.0" font-size="15" fill="#c92a2a" text-anchor="start">Same NAT runs, two graders → do they agree within 10 points? (that&#x27;s Bet B)  → Mission 4: open one disagreement, decide who was right</text></svg>