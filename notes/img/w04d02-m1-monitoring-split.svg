ctions</text><text x="50.0" y="416.8" font-size="15" fill="#495057" text-anchor="start">as the PROXY (e.g. flag/escalation rate)</text><text x="495.0" y="80.0" font-size="18" fill="#e8590c" text-anchor="start">OPERATIONAL  -  engineer&#x27;s view</text><text x="510.0" y="133.0" font-size="18" fill="#1e1e1e" text-anchor="start">System performance</text><text x="510.0" y="158.0" font-size="15" fill="#495057" text-anchor="start">latency, errors, resource use</text><text x="510.0" y="253.0" font-size="18" fill="#1e1e1e" text-anchor="start">Pipelines</text><text x="510.0" y="278.0" font-size="15" fill="#495057" text-anchor="start">data pipeline + model pipeline</text><text x="510.0" y="373.0" font-size="18" fill="#1e1e1e" text-anchor="start">Cost</text><text x="510.0" y="398.0" font-size="15" fill="#495057" text-anchor="start">what the ML system costs to run</text><text x="20.0" y="506.0" font-size="16" fill="#495057" text-anchor="start">Today: each of your 7 agent metrics goes in one of these two boxes.</text></svg>