<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -20 1025 440" width="1025" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-15" y="-20" width="1025" height="440" fill="#ffffff"/><ellipse cx="75.0" cy="105.0" rx="55.0" ry="25.0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef"/><polyline points="130.0,105.0 170.0,105.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="158.9,109.7 170.0,105.0 158.9,100.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="170" y="75" width="140" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff"/><polyline points="310.0,105.0 350.0,105.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="338.9,109.7 350.0,105.0 338.9,100.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="350" y="75" width="160" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8"/><polyline points="510.0,105.0 570.0,105.0" stroke="#e8590c" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="558.9,109.7 570.0,105.0 558.9,100.3" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="570" y="70" width="230" height="70" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf"/><rect x="20" y="250" width="300" height="70" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d0bfff"/><polyline points="320.0,285.0 380.0,285.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="368.9,289.7 380.0,285.0 368.9,280.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="380" y="250" width="200" height="70" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8"/><polyline points="580.0,270.0 640.0,240.0" stroke="#2f9e44" stroke-width="2" fill="none"/><polyline points="632.2,249.1 640.0,240.0 628.0,240.8" fill="none" stroke="#2f9e44" stroke-width="2"/><rect x="640" y="200" width="350" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><polyline points="580.0,300.0 640.0,330.0" stroke="#e03131" stroke-width="2" fill="none"/><polyline points="628.0,329.2 640.0,330.0 632.2,320.9" fill="none" stroke="#e03131" stroke-width="2"/><rect x="640" y="300" width="350" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffc9c9"/><polyline points="640.0,140.0 480.0,250.0" stroke="#e8590c" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="486.5,239.9 480.0,250.0 491.8,247.6" fill="none" stroke="#e8590c" stroke-width="2"/><text x="20.0" y="24.0" font-size="24" fill="#1e1e1e" text-anchor="start">Approval across processes: interrupt() + checkpointer</text><text x="20.0" y="68.0" font-size="18" fill="#495057" text-anchor="start">Process 1:  start</text><text x="75.0" y="112.5" font-size="20" fill="#1e1e1e" text-anchor="middle">START</text><text x="240.0" y="100.0" font-size="20" fill="#1e1e1e" text-anchor="middle">plan</text><text x="240.0" y="125.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(typed Plan)</text><text x="430.0" y="100.0" font-size="20" fill="#1e1e1e" text-anchor="middle">approve</text><text x="430.0" y="125.0" font-size="20" fill="#1e1e1e" text-anchor="middle">interrupt(plan)</text><text x="685.0" y="87.5" font-size="20" fill="#1e1e1e" text-anchor="middle">approvals.db</text><text x="685.0" y="112.5" font-size="20" fill="#1e1e1e" text-anchor="middle">thread_id = case-9</text><text x="685.0" y="137.5" font-size="20" fill="#1e1e1e" text-anchor="middle">(process exits)</text><text x="20.0" y="191.0" font-size="16" fill="#868e96" text-anchor="start">...hours or days later, after a restart if need be...</text><text x="20.0" y="238.0" font-size="18" fill="#495057" text-anchor="start">Process 2:  approve | reject &lt;reviewer&gt;</text><text x="170.0" y="280.0" font-size="20" fill="#1e1e1e" text-anchor="middle">invoke(Command(resume=</text><text x="170.0" y="305.0" font-size="20" fill="#1e1e1e" text-anchor="middle">{approved, reviewer}), case-9)</text><text x="480.0" y="267.5" font-size="20" fill="#1e1e1e" text-anchor="middle">approve re-runs</text><text x="480.0" y="292.5" font-size="20" fill="#1e1e1e" text-anchor="middle">interrupt() returns</text><text x="480.0" y="317.5" font-size="20" fill="#1e1e1e" text-anchor="middle">the decision</text><text x="815.0" y="225.0" font-size="20" fill="#1e1e1e" text-anchor="middle">approved: Command(goto=execute)</text><text x="815.0" y="250.0" font-size="20" fill="#1e1e1e" text-anchor="middle">ReAct per plan step</text><text x="815.0" y="325.0" font-size="20" fill="#1e1e1e" text-anchor="middle">rejected: Command(goto=END)</text><text x="815.0" y="350.0" font-size="20" fill="#1e1e1e" text-anchor="middle">nothing executed</text><text x="650.0" y="182.0" font-size="14" fill="#e8590c" text-anchor="start">loads case-9</text><text x="20.0" y="396.0" font-size="16" fill="#1e1e1e" text-anchor="start">Before interrupt(): reads only (the node re-runs on resume). Side effects go after it.</text></svg>