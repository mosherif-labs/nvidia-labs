 y="60" width="170" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff"/><polyline points="20.0,190.0 380.0,190.0" stroke="#e8590c" stroke-width="2" fill="none"/><polyline points="400.0,190.0 1320.0,190.0" stroke="#1971c2" stroke-width="2" fill="none"/><text x="20.0" y="24.0" font-size="24" fill="#1e1e1e" text-anchor="start">case-1: 2 tool rounds = 7 checkpoints (one per super-step)</text><text x="105.0" y="97.5" font-size="20" fill="#1e1e1e" text-anchor="middle">step -1</text><text x="105.0" y="122.5" font-size="20" fill="#1e1e1e" text-anchor="middle">empty state</text><text x="105.0" y="147.5" font-size="20" fill="#1e1e1e" text-anchor="middle">next: __start__</text><text x="295.0" y="97.5" font-size="20" fill="#1e1e1e" text-anchor="middle">step 0</text><text x="295.0" y="122.5" font-size="20" fill="#1e1e1e" text-anchor="middle">your question</text><text x="295.0" y="147.5" font-size="20" fill="#1e1e1e" text-anchor="middle">next: agent</text><text x="485.0" y="85.0" font-size="20" fill="#1e1e1e" text-anchor="middle">step 1</text><text x="485.0" y="110.0" font-size="20" fill="#1e1e1e" text-anchor="middle">+ agent reply #1</text><text x="485.0" y="135.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(tool_calls)</text><text x="485.0" y="160.0" font-size="20" fill="#1e1e1e" text-anchor="middle">next: tools</text><text x="675.0" y="97.5" font-size="20" fill="#1e1e1e" text-anchor="middle">step 2</text><text x="675.0" y="122.5" font-size="20" fill="#1e1e1e" text-anchor="middle">+ tool results #1</text><text x="675.0" y="147.5" font-size="20" fill="#1e1e1e" text-anchor="middle">next: agent</text><text x="865.0" y="85.0" font-size="20" fill="#1e1e1e" text-anchor="middle">step 3</text><text x="865.0" y="110.0" font-size="20" fill="#1e1e1e" text-anchor="middle">+ agent reply #2</text><text x="865.0" y="135.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(tool_calls)</text><text x="865.0" y="160.0" font-size="20" fill="#1e1e1e" text-anchor="middle">next: tools</text><text x="1055.0" y="97.5" font-size="20" fill="#1e1e1e" text-anchor="middle">step 4</text><text x="1055.0" y="122.5" font-size="20" fill="#1e1e1e" text-anchor="middle">+ tool results #2</text><text x="1055.0" y="147.5" font-size="20" fill="#1e1e1e" text-anchor="middle">next: agent</text><text x="1245.0" y="85.0" font-size="20" fill="#1e1e1e" text-anchor="middle">step 5</text><text x="1245.0" y="110.0" font-size="20" fill="#1e1e1e" text-anchor="middle">+ final answer</text><text x="1245.0" y="135.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(no tool_calls)</text><text x="1245.0" y="160.0" font-size="20" fill="#1e1e1e" text-anchor="middle">next: () done</text><text x="20.0" y="216.0" font-size="16" fill="#e8590c" text-anchor="start">2 &#x27;free&#x27; checkpoints before any node runs</text><text x="20.0" y="236.0" font-size="16" fill="#e8590c" text-anchor="start">(empty + input)</text><text x="400.0" y="216.0" font-size="16" fill="#1971c2" text-anchor="start">+1 per node run: agent, tools, agent, tools, agent = 5</text><text x="20.0" y="278.0" font-size="18" fill="#1e1e1e" text-anchor="start">Rule: checkpoints = 2 + node runs.  Docs START -&gt; A -&gt; B: 2 + 2 = 4.  Here: 2 + 5 = 7.</text></svg>