ill="#1e1e1e" text-anchor="middle">Agent runtime</text><text x="1005.0" y="190.6" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Fabric (runs agent harnesses)</text><text x="1005.0" y="209.4" font-size="15" fill="#1e1e1e" text-anchor="middle">NAT — deprecated, EOL end-2026</text><text x="1330.0" y="181.2" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Guardrails</text><text x="1330.0" y="200.0" font-size="15" fill="#1e1e1e" text-anchor="middle">output rail</text><text x="1540.0" y="190.6" font-size="15" fill="#1e1e1e" text-anchor="middle">Response</text><text x="560.0" y="249.0" font-size="13" fill="#495057" text-anchor="start">deploy</text><text x="387.0" y="326.0" font-size="18" fill="#495057" text-anchor="start">WHAT THE AGENT CALLS (plan → act → observe loop)</text><text x="560.0" y="386.2" font-size="15" fill="#1e1e1e" text-anchor="middle">LLM brain: Nemotron via NIM</text><text x="560.0" y="405.0" font-size="15" fill="#1e1e1e" text-anchor="middle">OpenAI API · TensorRT-LLM inside</text><text x="560.0" y="486.2" font-size="15" fill="#1e1e1e" text-anchor="middle">Dynamo</text><text x="560.0" y="505.0" font-size="15" fill="#1e1e1e" text-anchor="middle">KV-aware routing across GPUs</text><text x="960.0" y="376.9" font-size="15" fill="#1e1e1e" text-anchor="middle">Tools</text><text x="960.0" y="395.6" font-size="15" fill="#1e1e1e" text-anchor="middle">MCP servers · A2A agents · APIs</text><text x="960.0" y="414.4" font-size="15" fill="#1e1e1e" text-anchor="middle">(guarded by tool rails)</text><text x="1360.0" y="386.2" font-size="15" fill="#1e1e1e" text-anchor="middle">Knowledge: NeMo Retriever</text><text x="1360.0" y="405.0" font-size="15" fill="#1e1e1e" text-anchor="middle">embed + rerank NIMs · extraction</text><text x="1360.0" y="486.2" font-size="15" fill="#1e1e1e" text-anchor="middle">cuVS / Milvus</text><text x="1360.0" y="505.0" font-size="15" fill="#1e1e1e" text-anchor="middle">GPU vector search</text><text x="700.0" y="287.0" font-size="13" fill="#495057" text-anchor="start">reason / plan</text><text x="990.0" y="287.0" font-size="13" fill="#495057" text-anchor="start">act</text><text x="1215.0" y="287.0" font-size="13" fill="#495057" text-anchor="start">retrieve</text><text x="1560.0" y="355.0" font-size="15" fill="#495057" text-anchor="start">Legend</text><text x="1660.0" y="386.9" font-size="13" fill="#1e1e1e" text-anchor="middle">NeMo framework / API</text><text x="1660.0" y="426.9" font-size="13" fill="#1e1e1e" text-anchor="middle">GPU acceleration</text><text x="1660.0" y="466.9" font-size="13" fill="#1e1e1e" text-anchor="middle">Platform / models</text><text x="1660.0" y="506.9" font-size="13" fill="#1e1e1e" text-anchor="middle">Deprecated</text><text x="37.0" y="606.0" font-size="18" fill="#495057" text-anchor="start">OBSERVE → IMPROVE (the flywheel, right to left)</text><text x="205.0" y="671.9" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Customizer</text><text x="205.0" y="690.6" font-size="15" fill="#1e1e1e" text-anchor="middle">fine-tune on failures</text><text x="205.0" y="709.4" font-size="15" fill="#1e1e1e" text-anchor="middle">(LoRA · DPO)</text><text x="595.0" y="681.2" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Evaluator + Auditor</text><text x="595.0" y="700.0" font-size="15" fill="#1e1e1e" text-anchor="middle">agent &amp; RAG metrics · red-team</text><text x="970.0" y="681.2" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Helix (CLI)</text><text x="970.0" y="700.0" font-size="15" fill="#1e1e1e" text-anchor="middle">evaluate · optimize · harden</text><text x="1325.0" y="671.9" font-size="15" fill="#1e1e1e" text-anchor="middle">NeMo Relay</text><text x="1325.0" y="690.6" font-size="15" fill="#1e1e1e" text-anchor="middle">traces · middleware · governance</text><text x="1325.0" y="709.4" font-size="15" fill="#1e1e1e" text-anchor="middle">(replaces NAT observability)</text><text x="1050.0" y="613.0" font-size="13" fill="#495057" text-anchor="start">spans from every step</text><text x="380.0" y="753.0" font-size="13" fill="#495057" text-anchor="start">failures → data</text><text x="215.0" y="373.0" font-size="13" fill="#c92a2a" text-anchor="start">tuned model → redeploy</text><text x="37.0" y="846.0" font-size="18" fill="#495057" text-anchor="start">FOUNDATION — everything above runs on this</text><text x="146.1" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">DGX / DGX Cloud</text><text x="362.2" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">CUDA</text><text x="578.3" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">cuDNN · cuBLAS</text><text x="794.4" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">NCCL</text><text x="1010.6" y="888.5" font-size="14" fill="#1e1e1e" text-anchor="middle">Transformer</text><text x="1010.6" y="906.0" font-size="14" fill="#1e1e1e" text-anchor="middle">Engine (FP8)</text><text x="1226.7" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">Run:ai</text><text x="1442.8" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">Nsight · DCGM</text><text x="1658.9" y="897.2" font-size="14" fill="#1e1e1e" text-anchor="middle">NGC Catalog</text></svg>