<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 900 562" width="900" height="562" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="900" height="562" fill="#ffffff"/><rect x="20" y="50" width="860" height="260" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff9db"/><rect x="20" y="330" width="860" height="150" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><rect x="40" y="100" width="180" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff"/><rect x="250" y="100" width="180" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff"/><rect x="460" y="100" width="180" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff"/><rect x="670" y="100" width="180" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffffff"/><polyline points="220.0,155.0 250.0,155.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="238.9,159.7 250.0,155.0 238.9,150.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="430.0,155.0 460.0,155.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="448.9,159.7 460.0,155.0 448.9,150.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="640.0,155.0 670.0,155.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="658.9,159.7 670.0,155.0 658.9,150.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="250" y="380" width="180" height="80" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d0ebff"/><rect x="670" y="380" width="180" height="80" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d0ebff"/><polyline points="340.0,210.0 340.0,380.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="335.3,368.9 340.0,380.0 344.7,368.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="760.0,210.0 760.0,380.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="755.3,368.9 760.0,380.0 764.7,368.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="800.0,380.0 800.0,250.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="804.7,261.1 800.0,250.0 795.3,261.1" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="20.0" y="32.0" font-size="22" fill="#1e1e1e" text-anchor="start">Who does RAG? Your code does. The model only reads text.</text><text x="30.0" y="76.0" font-size="18" fill="#1e1e1e" text-anchor="start">YOUR SIDE: agent / app code (baseline.py)</text><text x="30.0" y="356.0" font-size="18" fill="#1e1e1e" text-anchor="start">MODEL SIDE: NIM endpoints (stateless, no memory of your docs)</text><text x="50.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">1 question</text><text x="50.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">from user</text><text x="260.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">2 embed()</text><text x="260.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">question</text><text x="470.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">3 Milvus search</text><text x="470.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">+ status filter</text><text x="680.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">4 build prompt:</text><text x="680.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">numbered chunks</text><text x="680.0" y="162.5" font-size="15" fill="#1e1e1e" text-anchor="start">+ question</text><text x="260.0" y="405.0" font-size="15" fill="#1e1e1e" text-anchor="start">embedding NIM</text><text x="260.0" y="423.8" font-size="15" fill="#1e1e1e" text-anchor="start">text -&gt; vector</text><text x="680.0" y="405.0" font-size="15" fill="#1e1e1e" text-anchor="start">LLM NIM</text><text x="680.0" y="423.8" font-size="15" fill="#1e1e1e" text-anchor="start">reads prompt,</text><text x="680.0" y="442.5" font-size="15" fill="#1e1e1e" text-anchor="start">writes cited answer</text><text x="810.0" y="264.0" font-size="14" fill="#1e1e1e" text-anchor="start">5 answer</text><text x="810.0" y="281.5" font-size="14" fill="#1e1e1e" text-anchor="start">[1][3]</text><text x="40.0" y="245.0" font-size="15" fill="#1e1e1e" text-anchor="start">Retrieval, filtering and citations are decided HERE.</text><text x="40.0" y="263.8" font-size="15" fill="#1e1e1e" text-anchor="start">Swap the LLM and the stale-policy filter still holds.</text><text x="20.0" y="510.0" font-size="15" fill="#1e1e1e" text-anchor="start">Agentic RAG (later days): retrieval becomes a TOOL. The LLM decides when to call search();</text><text x="20.0" y="528.8" font-size="15" fill="#1e1e1e" text-anchor="start">your code still runs the search. The model asks, the agent fetches.</text></svg>