stroke-width="1" fill="#ffc9c9"/><polyline points="80.0,216.0 640.0,216.0" stroke="#757575" stroke-width="1" fill="none"/><ellipse cx="80.0" cy="330.0" rx="8.0" ry="8.0" stroke="#1e1e1e" stroke-width="1" fill="#757575"/><ellipse cx="110.0" cy="330.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="270.0" cy="330.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="80.0" cy="356.0" rx="8.0" ry="8.0" stroke="#1e1e1e" stroke-width="1" fill="#757575"/><ellipse cx="160.0" cy="356.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="340.0" cy="356.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="80.0" cy="382.0" rx="8.0" ry="8.0" stroke="#1e1e1e" stroke-width="1" fill="#757575"/><ellipse cx="90.0" cy="382.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="200.0" cy="382.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="80.0" cy="408.0" rx="8.0" ry="8.0" stroke="#1e1e1e" stroke-width="1" fill="#757575"/><ellipse cx="140.0" cy="408.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="420.0" cy="408.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="80.0" cy="434.0" rx="8.0" ry="8.0" stroke="#1e1e1e" stroke-width="1" fill="#757575"/><ellipse cx="125.0" cy="434.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><ellipse cx="300.0" cy="434.0" rx="8.0" ry="8.0" stroke="#22c55e" stroke-width="1" fill="#b2f2bb"/><polyline points="80.0,456.0 640.0,456.0" stroke="#757575" stroke-width="1" fill="none"/><text x="20.0" y="70.0" font-size="20" fill="#b91c1c" text-anchor="start">Without jitter: wait 1s, then 2s (same for everyone)</text><text x="40.0" y="96.0" font-size="16" fill="#757575" text-anchor="start">A</text><text x="40.0" y="122.0" font-size="16" fill="#757575" text-anchor="start">B</text><text x="40.0" y="148.0" font-size="16" fill="#757575" text-anchor="start">C</text><text x="40.0" y="174.0" font-size="16" fill="#757575" text-anchor="start">D</text><text x="40.0" y="200.0" font-size="16" fill="#757575" text-anchor="start">E</text><text x="72.0" y="236.0" font-size="14" fill="#757575" text-anchor="start">0s</text><text x="172.0" y="236.0" font-size="14" fill="#757575" text-anchor="start">1s</text><text x="272.0" y="236.0" font-size="14" fill="#757575" text-anchor="start">2s</text><text x="372.0" y="236.0" font-size="14" fill="#757575" text-anchor="start">3s</text><text x="472.0" y="236.0" font-size="14" fill="#757575" text-anchor="start">4s</text><text x="440.0" y="111.0" font-size="16" fill="#b91c1c" text-anchor="start">Retries land in waves:</text><text x="440.0" y="131.0" font-size="16" fill="#b91c1c" text-anchor="start">5 calls hit the server at</text><text x="440.0" y="151.0" font-size="16" fill="#b91c1c" text-anchor="start">the same instant, it fails</text><text x="440.0" y="171.0" font-size="16" fill="#b91c1c" text-anchor="start">again, and the wave repeats</text><text x="20.0" y="310.0" font-size="20" fill="#15803d" text-anchor="start">Full jitter: wait random(0, 1s), then random(0, 2s)</text><text x="40.0" y="336.0" font-size="16" fill="#757575" text-anchor="start">A</text><text x="40.0" y="362.0" font-size="16" fill="#757575" text-anchor="start">B</text><text x="40.0" y="388.0" font-size="16" fill="#757575" text-anchor="start">C</text><text x="40.0" y="414.0" font-size="16" fill="#757575" text-anchor="start">D</text><text x="40.0" y="440.0" font-size="16" fill="#757575" text-anchor="start">E</text><text x="72.0" y="476.0" font-size="14" fill="#757575" text-anchor="start">0s</text><text x="172.0" y="476.0" font-size="14" fill="#757575" text-anchor="start">1s</text><text x="272.0" y="476.0" font-size="14" fill="#757575" text-anchor="start">2s</text><text x="372.0" y="476.0" font-size="14" fill="#757575" text-anchor="start">3s</text><text x="472.0" y="476.0" font-size="14" fill="#757575" text-anchor="start">4s</text><text x="440.0" y="351.0" font-size="16" fill="#15803d" text-anchor="start">Same number of retries,</text><text x="440.0" y="371.0" font-size="16" fill="#15803d" text-anchor="start">spread out: the server</text><text x="440.0" y="391.0" font-size="16" fill="#15803d" text-anchor="start">sees a trickle it can</text><text x="440.0" y="411.0" font-size="16" fill="#15803d" text-anchor="start">actually handle</text><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">Why jitter? 5 clients fail at t=0 (service overloaded) and retry</text><text x="20.0" y="534.0" font-size="14" fill="#757575" text-anchor="start">Grey = first call (all fail at t=0). Coloured = a retry. Row = one client.</text></svg>