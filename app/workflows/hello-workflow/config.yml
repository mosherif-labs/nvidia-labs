general:
  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: aai-nat

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b   # Super 404s on this account since 2026-10-27 (Day 13)
    temperature: 1.0
    top_p: 0.95
    max_tokens: 4096    # NAT's NIM default is 300; a reasoning model's thoughts get cut off mid-sentence

functions:
  current_datetime:
    _type: current_datetime

function_groups:
  fincrime:
    _type: mcp_client
    server:
      transport: stdio
      command: uv
      args: ["run", "--with", "mcp", "--with", "pydantic", "python", "../../mcp/mcp_server.py"]
    include:              # the allowlist: flag_alert exists on the server but this agent can't see it
      - get_alert
      - search_policy

workflow:
  _type: react_agent
  tool_names: [fincrime, current_datetime]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3

eval:
  general:
    output_dir: ./.tmp/eval/
    max_concurrency: 2           # lower it if the judge calls hit 429 Too Many Requests
    dataset:
      _type: json
      file_path: data/golden_nat.json
  evaluators:
    trajectory_accuracy:
      _type: trajectory
      llm_name: nim_llm
