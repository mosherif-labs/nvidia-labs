    model_name: nvidia/nemotron-3.5-super-vl-120b-a12b

workflow:
  _type: langgraph_wrapper
  description: Financial-crime investigation team (supervisor + 3 workers)
  dependencies:
    - ../../team
  graph: ../../team/team.py:team
  env: .env
