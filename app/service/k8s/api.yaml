apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 2                                   # HA: at least two, on different nodes
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: capstone-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env: [{name: REDIS_URL, value: "redis://redis:6379/0"}]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 512Mi}}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
