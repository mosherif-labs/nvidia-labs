# One agent codebase: `app/` is installed (editable) by `uv sync`, so `from app.tools.registry import registry`
# works from any folder, and `uv run python x.py` inside app/<module>/ keeps working.
[project]
name = "nvidia-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.1",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=2.0",
    "milvus-lite>=3.2.2",
    "openai>=1.54",
    "openinference-instrumentation-openai>=0.1.66",
    "optuna>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pymilvus>=3.0.2",
    "pypdf>=6.21.3",
    "python-dotenv>=1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
